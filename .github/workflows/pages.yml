name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir site
          cp index.html .nojekyll site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts | any(.name == "github-pages" and .expired == false)' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not appear in the Actions API."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
